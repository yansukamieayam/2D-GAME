<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL 2D-GAMES</title>
    <style>
        /* 1. Mengimpor Font Pixel dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        /* 2. Pengaturan Latar Belakang dan Layout Utama */
        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace; /* Font gaya pixel */
            color: #000000;
            background-color: #f43131;
            background-image: url('latar belakang lobi.jpg');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            image-rendering: pixelated; /* Menjaga kejelasan elemen piksel */
            overflow-x: hidden;
            position: relative;
            background-clip: border-box;
            background-origin: border-box;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.08);
        }

        .clouds {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            filter: contrast(1.05) saturate(0.9);
        }

        .cloud {
            position: absolute;
            width: 180px;
            height: 56px;
            border: 4px solid rgba(74, 56, 27, 0.7);
            background: #f7dc9f;
            opacity: 0;
            animation: cloudFloat linear infinite;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.16);
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: #f7dc9f;
            border: 4px solid rgba(74, 56, 27, 0.7);
        }

        .cloud::before {
            width: 70px;
            height: 42px;
            left: 18px;
            bottom: 18px;
        }

        .cloud::after {
            width: 84px;
            height: 42px;
            right: 22px;
            bottom: 12px;
        }

        .cloud-1 { top: 7%; left: -220px; animation-duration: 34s; animation-delay: 0s; }
        .cloud-2 { top: 15%; left: -170px; transform: scale(0.9); animation-duration: 42s; animation-delay: 9s; }
        .cloud-3 { top: 20%; left: -200px; transform: scale(0.75); animation-duration: 38s; animation-delay: 17s; }
        .cloud-4 { top: 8%; left: -210px; transform: scale(0.8); animation-duration: 46s; animation-delay: 23s; }

        @keyframes cloudFloat {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 0;
            }
            12% { opacity: 0.9; }
            88% { opacity: 0.9; }
            100% {
                transform: translateX(calc(100vw + 320px)) translateY(-8px);
                opacity: 0;
            }
        }

        /* 3. Kontainer Utama Lobi */
        .lobby-container {
            text-align: center;
            width: 320px;
            position: relative;
            z-index: 1;
            animation: lobbyFloat 4.8s ease-in-out infinite;
            filter: drop-shadow(0 12px 0 rgba(0, 0, 0, 0.18));
            perspective: 1000px;
            transition: transform 0.18s ease;
        }

        @keyframes lobbyFloat {
            0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
            50% { transform: translateY(-8px) rotateX(2deg) rotateY(-2deg); }
        }

        @keyframes menuReveal {
            0% { opacity: 0; transform: translateY(18px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); text-shadow: 4px 4px #444444, 0 0 18px rgba(255, 255, 255, 0.22); }
            50% { transform: scale(1.035); text-shadow: 4px 4px #444444, 0 0 22px rgba(255, 255, 255, 0.45); }
        }

        /* 4. Judul Game Piksel */
        .game-title {
            font-size: 1.6rem;
            margin-bottom: 350px;
            line-height: 1.5;
            color: #ffffff;
            text-shadow: 4px 4px #444444;
            letter-spacing: 1px;
            animation: titlePulse 2.5s ease-in-out infinite;
        }

        /* 5. Pembungkus Tombol Menu */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 23px; /* Jarak antar tombol */
        }

        .menu-buttons .btn {
            animation: menuReveal 0.55s ease both;
        }

        .menu-buttons .btn:nth-child(1) { animation-delay: 0.06s; }
        .menu-buttons .btn:nth-child(2) { animation-delay: 0.12s; }
        .menu-buttons .btn:nth-child(3) { animation-delay: 0.18s; }

        .sound-toggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.56rem;
            padding: 0;
            border: 4px solid #ffffff;
            cursor: pointer;
            outline: none;
            z-index: 1000;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
            transform: translateY(0) scale(1);
            touch-action: manipulation;
            user-select: none;
            box-shadow: 
                -4px 0 0 0 #000000,
                 4px 0 0 0 #000000,
                 0 -4px 0 0 #000000,
                 0  4px 0 0 #000000,
                 4px 4px 0 0 #aaaaaa;
            animation: soundPulse 2.8s ease-in-out infinite;
        }

        @keyframes soundPulse {
            0%, 100% { box-shadow: -4px 0 0 0 #000000, 4px 0 0 0 #000000, 0 -4px 0 0 #000000, 0 4px 0 0 #000000, 4px 4px 0 0 #aaaaaa; }
            50% { box-shadow: -4px 0 0 0 #000000, 4px 0 0 0 #000000, 0 -4px 0 0 #000000, 0 4px 0 0 #000000, 7px 7px 0 0 #e7e7e7; }
        }

        .sound-toggle:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                -4px 0 0 0 #000000,
                 4px 0 0 0 #000000,
                 0 -4px 0 0 #000000,
                 0  4px 0 0 #000000,
                 6px 6px 0 0 #cccccc;
            animation: uiPulse 0.25s ease-in-out 1;
        }

        .sound-toggle:active {
            transform: translate(3px, 3px) scale(0.98);
            box-shadow: 
                -4px 0 0 0 #000000,
                 4px 0 0 0 #000000,
                 0 -4px 0 0 #000000,
                 0  4px 0 0 #000000,
                 2px 2px 0 0 #666666;
            animation: buttonPress 0.12s ease-in-out 1;
        }

        /* 6. Gaya Tombol Putih Tema Pixel */
        .btn {
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.85rem;
            padding: 16px 12px;
            border: 4px solid #ffffff;
            border-radius: 0;
            cursor: pointer;
            outline: none;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease, filter 0.12s ease;
            transform: translateY(0) scale(1);
            touch-action: manipulation;
            user-select: none;
            box-shadow: 
                -4px 0 0 0 #000000,
                 4px 0 0 0 #000000,
                 0 -4px 0 0 #000000,
                 0  4px 0 0 #000000,
                 4px 4px 0 0 #8a8a8a;
        }

        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 15%, rgba(255,255,255,0.8) 50%, transparent 85%);
            transform: translateX(-140%);
            transition: transform 0.55s ease;
        }

        /* Efek saat kursor diarahkan ke tombol (Hover) */
        .btn:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.02);
            box-shadow: 
                -4px 0 0 0 #000000,
                 4px 0 0 0 #000000,
                 0 -4px 0 0 #000000,
                 0  4px 0 0 #000000,
                 6px 6px 0 0 #cccccc;
            animation: uiPulse 0.25s ease-in-out 1;
        }

        .btn:hover::before {
            transform: translateX(140%);
        }

        /* Efek saat tombol ditekan (Active) */
        .btn:active {
            transform: translate(3px, 3px) scale(0.98); /* Tombol sedikit bergeser ke bawah-kanan */
            box-shadow: 
                -4px 0 0 0 #000000,
                 4px 0 0 0 #000000,
                 0 -4px 0 0 #000000,
                 0  4px 0 0 #000000,
                 2px 2px 0 0 #666666;
            animation: buttonPress 0.12s ease-in-out 1;
        }

        @keyframes buttonPress {
            0% { transform: translate(0, 0) scale(1); }
            30% { transform: translate(4px, 4px) scale(0.98); }
            100% { transform: translate(3px, 3px) scale(0.98); }
        }

        @keyframes uiPulse {
            0% { box-shadow: -4px 0 0 0 #000000, 4px 0 0 0 #000000, 0 -4px 0 0 #000000, 0 4px 0 0 #000000, 4px 4px 0 0 #aaaaaa; }
            50% { box-shadow: -4px 0 0 0 #000000, 4px 0 0 0 #000000, 0 -4px 0 0 #000000, 0 4px 0 0 #000000, 8px 8px 0 0 #d9d9d9; }
            100% { box-shadow: -4px 0 0 0 #000000, 4px 0 0 0 #000000, 0 -4px 0 0 #000000, 0 4px 0 0 #000000, 6px 6px 0 0 #cccccc; }
        }

        @media (hover: none), (pointer: coarse) {
            .btn:hover,
            .sound-toggle:hover {
                transform: translateY(0) scale(1);
                animation: none;
            }

            .btn:active,
            .sound-toggle:active {
                transform: translate(3px, 3px) scale(0.97);
            }
        }

        .settings-screen,
        .about-screen {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            justify-items: center;
            gap: 12px;
            overflow-y: auto;
            padding: 22px;
            background:#f43131;
            color: #ffffff;
            text-align: center;
            animation: panelIn 0.28s ease-out;
        }

        @keyframes panelIn {
            0% { opacity: 0; transform: translateY(16px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes menuReveal {
            0% { opacity: 0; transform: translateY(18px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .settings-screen[hidden],
        .about-screen[hidden] {
            display: none;
        }

        .about-header,
        .settings-header {
            width: min(100%, 900px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.58rem;
        }

        .about-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .about-brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border: 3px solid #000000;
            background: #ffffff;
            color: #f43131;
            font-size: 1.1rem;
            box-shadow: 4px 4px 0 #000000;
        }

        .about-edition {
            color: #ffe4a8;
        }

        .about-content,
        .settings-panel {
            width: min(100%, 760px);
            height: min(58vh, 480px);
            min-height: 220px;
            border: 4px solid #000000;
            background: #ffffff;
            box-shadow: 8px 8px 0 #000000;
            color: #000000;
            padding: 18px;
            box-sizing: border-box;
        }

        .settings-panel {
            display: grid;
            place-items: center;
            align-content: center;
            gap: 18px;
            text-align: center;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: 0.7rem;
            line-height: 1.6;
        }

        .settings-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            padding: 14px 16px;
            border: 4px solid #000000;
            background: #f1f1f1;
            box-shadow: 4px 4px 0 #000000;
            color: #000000;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.58rem;
            cursor: pointer;
        }

        .settings-volume {
            width: min(100%, 520px);
            display: grid;
            gap: 16px;
            margin-top: 6px;
        }

        .volume-row {
            display: grid;
            grid-template-columns: 150px minmax(170px, 1fr) 56px;
            align-items: center;
            gap: 12px;
            text-align: left;
            font-size: 0.62rem;
        }

        .volume-row label {
            display: block;
        }

        .volume-control {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 14px;
            background: linear-gradient(90deg, #ffb703 0%, #ffb703 var(--value), #e9e9e9 var(--value), #e9e9e9 100%);
            border: 3px solid #000000;
            box-shadow: 3px 3px 0 #000000;
            outline: none;
        }

        .volume-control::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #ffffff;
            border: 3px solid #000000;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000000;
        }

        .volume-control::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #ffffff;
            border: 3px solid #000000;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000000;
        }

        .volume-value {
            min-width: 50px;
            text-align: right;
            font-size: 0.58rem;
        }

        .about-back,
        .settings-back {
            margin: 4px 0 8px;
        }

        @media (max-width: 520px) {
            .settings-screen,
            .about-screen {
                gap: 8px;
                padding: 14px;
            }

            .about-header,
            .settings-header {
                font-size: 0.48rem;
            }

            .about-brand-mark {
                width: 30px;
                height: 30px;
            }

            .about-content {
                height: min(58vh, 480px);
                min-height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="clouds" aria-hidden="true">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>
    </div>

    <audio id="bgm" src="soundtrack-lobi.mp3" loop preload="auto" playsinline></audio>


    <!--tampilan buat lobi game-->
    <div class="lobby-container">
        <h1 class="game-title">PETUALANGAN KU</h1>
        
        <div class="menu-buttons">
            <button class="btn" onclick="mulaiBermain()">PLAY</button>
            <button class="btn" onclick="bukaPengaturan()">SETTING</button>
            <button class="btn" onclick="bukaTentang()">ABOUT GAME</button>
        </div>
    </div>

    <section id="settingsScreen" class="settings-screen" aria-label="Pengaturan Game" hidden>
        <header class="settings-header">
            <div class="about-brand">
                <span class="about-brand-mark" aria-hidden="true">⚙</span>
                <span>SETTING</span>
            </div>
        </header>

        <div class="settings-panel">
            <div class="settings-row">
                <span>SOUND</span>
                <button class="settings-box" id="settingsSoundToggle" type="button">UNMUTE</button>
            </div>

            <div class="settings-volume">
                <div class="volume-row">
                    <label for="musicVolume">MUSIC</label>
                    <input id="musicVolume" class="volume-control" type="range" min="0" max="100" value="40" aria-label="Volume musik" />
                    <span id="musicVolumeValue" class="volume-value">40%</span>
                </div>
                <div class="volume-row">
                    <label for="sfxVolume">SOUND</label>
                    <input id="sfxVolume" class="volume-control" type="range" min="0" max="100" value="100" aria-label="Volume suara" />
                    <span id="sfxVolumeValue" class="volume-value">100%</span>
                </div>
            </div>
        </div>

        <button class="btn settings-back" type="button" onclick="kembaliKeMenu()">BACK</button>
    </section>

    <section id="aboutScreen" class="about-screen" aria-label="Tentang Game" hidden>
        <header class="about-header">
            <div class="about-brand">
                <span class="about-brand-mark" aria-hidden="true">✦</span>
                <span>PIXEL 2D-GAMES</span>
            </div>
        </header>

        <div class="about-content" aria-hidden="true"></div>

        <button class="btn about-back" type="button" onclick="kembaliKeMenu()">BACK</button>
    </section>

    <button id="soundToggle" class="sound-toggle" type="button">UNMUTE</button>

    <!-- Logika Interaksi (JavaScript) -->
    <script>
        const bgm = document.getElementById('bgm');
        const soundToggle = document.getElementById('soundToggle');
        const settingsSoundToggle = document.getElementById('settingsSoundToggle');
        const musicVolumeInput = document.getElementById('musicVolume');
        const sfxVolumeInput = document.getElementById('sfxVolume');
        const musicVolumeValue = document.getElementById('musicVolumeValue');
        const sfxVolumeValue = document.getElementById('sfxVolumeValue');
        const lobby = document.querySelector('.lobby-container');
        const aboutScreen = document.getElementById('aboutScreen');
        const settingsScreen = document.getElementById('settingsScreen');
        let isMuted = true;
        let musicVolume = 40;
        let sfxVolume = 100;

        function applyVolumeStyles(input) {
            const min = Number(input.min) || 0;
            const max = Number(input.max) || 100;
            const value = Number(input.value) || 0;
            const percent = ((value - min) / (max - min)) * 100;
            input.style.setProperty('--value', `${percent}%`);
        }

        function updateVolumeLabels() {
            musicVolumeValue.textContent = `${musicVolume}%`;
            sfxVolumeValue.textContent = `${sfxVolume}%`;
            if (musicVolumeInput) {
                musicVolumeInput.value = musicVolume;
                applyVolumeStyles(musicVolumeInput);
            }
            if (sfxVolumeInput) {
                sfxVolumeInput.value = sfxVolume;
                applyVolumeStyles(sfxVolumeInput);
            }
        }

        function syncAudioVolume() {
            if (!bgm) return;
            const effectiveMusicVolume = isMuted ? 0 : musicVolume / 100;
            bgm.volume = effectiveMusicVolume * 0.7;
            bgm.muted = false;
        }

        function playBgm() {
            if (!bgm) return;
            syncAudioVolume();
            bgm.loop = false;
            if (bgm.paused) {
                const playPromise = bgm.play();
                if (playPromise && typeof playPromise.then === 'function') {
                    playPromise.catch(() => {
                        setTimeout(() => {
                            bgm.play().catch(() => {});
                        }, 200);
                    });
                }
            }
            bgm.onended = () => {
                bgm.currentTime = 0;
                bgm.play().catch(() => {});
            };
        }

        function stopBgm() {
            if (!bgm) return;
            bgm.pause();
            bgm.currentTime = 0;
            bgm.onended = null;
        }

        function updateSoundLabels() {
            const label = isMuted ? 'UNMUTE' : 'MUTE';
            soundToggle.textContent = label;
            if (settingsSoundToggle) {
                settingsSoundToggle.textContent = label;
            }
            syncAudioVolume();
        }

        function animateIntro() {
            lobby.animate(
                [
                    { transform: 'translateY(15px) scale(0.97)', opacity: 0 },
                    { transform: 'translateY(0) scale(1)', opacity: 1 }
                ],
                {
                    duration: 650,
                    easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                    fill: 'forwards'
                }
            );
        }

        function toggleSound() {
            if (!bgm) return;

            isMuted = !isMuted;
            if (isMuted) {
                bgm.muted = true;
                bgm.pause();
            } else {
                bgm.muted = false;
                playBgm();
            }
            updateSoundLabels();
        }

        soundToggle.addEventListener('click', toggleSound);
        if (settingsSoundToggle) {
            settingsSoundToggle.addEventListener('click', toggleSound);
        }

        if (musicVolumeInput) {
            musicVolumeInput.addEventListener('input', (event) => {
                musicVolume = Number(event.target.value);
                updateVolumeLabels();
                if (!isMuted) {
                    syncAudioVolume();
                }
            });
        }

        if (sfxVolumeInput) {
            sfxVolumeInput.addEventListener('input', (event) => {
                sfxVolume = Number(event.target.value);
                updateVolumeLabels();
            });
        }

        function mulaiBermain() {
            stopBgm();
            window.location.href = 'story1.html';
        }

        function bukaPengaturan() {
            lobby.hidden = true;
            aboutScreen.hidden = true;
            settingsScreen.hidden = false;
            if (!isMuted) {
                playBgm();
            }
        }

        function bukaTentang() {
            lobby.hidden = true;
            settingsScreen.hidden = true;
            aboutScreen.hidden = false;
            if (!isMuted) {
                playBgm();
            }
        }

        function kembaliKeMenu() {
            aboutScreen.hidden = true;
            settingsScreen.hidden = true;
            lobby.hidden = false;
            lobby.style.transform = '';
            if (!isMuted) {
                playBgm();
            }
        }

        document.addEventListener('pointermove', (event) => {
            const x = (event.clientX / window.innerWidth - 0.5) * 18;
            const y = (event.clientY / window.innerHeight - 0.5) * 18;
            if (!lobby.hidden) {
                lobby.style.transform = `translate(${x * 0.5}px, ${y * 0.4}px) rotateX(${(-y * 0.6).toFixed(2)}deg) rotateY(${(x * 0.8).toFixed(2)}deg)`;
            }
        });

        document.addEventListener('pointerleave', () => {
            if (!lobby.hidden) {
                lobby.style.transform = '';
            }
        });

        animateIntro();
        updateVolumeLabels();
        updateSoundLabels();
    </script>

</body>
</html>
